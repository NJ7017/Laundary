name = "laundary"
main = "server/worker.js"
compatibility_date = "2024-09-28"

# Workers Static Assets configuration for React Single-Page Application (SPA)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "laundary-db"
database_id = "992977bc-82f9-47be-a645-2e0d860d4b0f"
